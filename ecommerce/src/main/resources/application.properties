spring.application.name=ecommerce

# Server
server.port=${SERVER_PORT:8080}

# MySQL (business data; the schema is generated by Hibernate)
# Default: run on the host. Under Docker Compose, DB_URL points to the mysql-db service.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusmarket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
# Everything the controllers return is already mapped from the domain inside a transaction.
spring.jpa.open-in-view=false

# MongoDB (audit trail). Spring Boot 4 uses the spring.mongodb prefix.
# Default: run on the host. Under Docker Compose, MONGODB_URI points to the mongo-db service.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/audit_db}

# JWT
# The default is only meant to run the project out of the box for coursework: it is public
# (it lives in source control), so anyone can forge tokens against a deployment that keeps it.
# Set JWT_SECRET to your own random value (at least 32 bytes) in any shared environment.
jwt.secret=${JWT_SECRET:NEXUSMARKET_DEV_SECRET_CHANGE_ME_0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Demo data loaded on startup (idempotent). Set SEED_ENABLED=false to disable it.
app.seed.enabled=${SEED_ENABLED:true}

# Actuator: only health and info are exposed
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
